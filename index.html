<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15110f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riyaz">
<title>Riyaz · Gurukool</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=2.1.9">
</head>
<body>
<header class="sk-head">
  <a class="sk-brand" href="https://akshaybangalorekar.github.io/Gurukool/">
    <span class="sk-logo">🎵</span>
    <span class="sk-title">Riyaz</span>
  </a>
  <div class="sk-guru">Guru: Viraj Salvi &nbsp;·&nbsp; Gwalior Gharana</div>
  <button class="sk-vadya" id="btnVadya" type="button" title="Vadya — instruments">Vadya</button>
  <button class="sk-vadya" id="btnShruti" type="button" title="Shruti — the 22 microtones">Shruti</button>
  <button class="sk-vadya" id="btnSwar" type="button" title="Swar — hear what is being sung">Swar</button>
  <button class="sk-gear" id="btnSettings" type="button" aria-label="Settings" title="Settings">⚙</button>
</header>

<div class="sk-banner" id="skSettings"><div class="sk-banner-in" id="skSettingsBox"></div></div>
<div class="sk-banner vadya" id="skVadya"><div class="sk-banner-in" id="skVadyaBox"></div></div>
<div class="sk-banner shruti" id="skShruti"><div class="sk-banner-in" id="skShrutiBox"></div></div>
<div class="sk-banner swar" id="skSwar"><div class="sk-banner-in" id="skSwarBox"></div></div>

<nav class="sk-tabs" id="tabs"></nav>

<main class="sk-main">
  <aside class="sk-list" id="list"></aside>
  <section class="sk-stage" id="stage">
    <div class="sk-empty">
      <p>Pick a lesson above.</p>
      <p class="sk-dim">Alankar · Taal · Raag</p>
    </div>
  </section>
</main>

<button class="rail-tab" id="btnRail" type="button" aria-label="Show or hide the list" title="Show / hide list">‹</button>

<footer class="sk-foot">
  <span>Gurukool · Riyaz</span>
  <span class="sk-dim" id="appVer"></span>
</footer>

<!-- the last-saved date, pinned to the foot of every page -->
<div class="sk-savedbar" role="status" aria-live="polite"><span id="savedAt"></span></div>

<script src="assets/data.js?v=2.1.3"></script>
<script src="assets/tools.js?v=9"></script>
<script src="assets/app.js?v=2.3.1"></script>
</body>
</html>
